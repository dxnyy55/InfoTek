<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Iniciar sesión - InfoTek</title>
        <link rel="stylesheet" href="../estilos/login.css">
        <style>
            .input-password-container {
                position: relative;
                display: flex;
                align-items: center;
                width: 100%;
                margin-bottom: 5px;
            }
            .input-password-container input {
                width: 100%;
                padding-right: 45px;
                margin-bottom: 0 !important;
            }
            .toggle-eye {
                position: absolute;
                right: 12px;
                background: none;
                border: none;
                cursor: pointer;
                font-size: 18px;
                padding: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #666;
            }
            /* Estilo para el mensaje de error en rojo debajo de la contraseña */
            .error-mensaje {
                color: #ff4d4d;
                font-size: 13px;
                font-weight: 600;
                margin-bottom: 12px;
                text-align: left;
                display: block;
                min-height: 18px;
            }
            .btn:disabled {
                opacity: 0.8;
                cursor: not-allowed;
                background-color: #2a2a80;
            }
            .cpu-fan-spinner {
                display: inline-block;
                width: 18px;
                height: 18px;
                margin-right: 8px;
                vertical-align: middle;
                animation: girarVentilador 0.8s linear infinite;
            }
            .cpu-fan-spinner::before {
                content: "⚙️";
                font-size: 16px;
            }
            @keyframes girarVentilador {
                from { transform: rotate(0deg); }
                to { transform: rotate(360deg); }
            }
        </style>
    </head>

    <body class="fondo-login">

        <div class="tarjeta-login">

            <img src="../recursos/imagenes/logo2.png" alt="InfoTek">

            <h1>InfoTek</h1>
            <p>Compara componentes y toma la mejor decisión</p>

            <form id="form-login">

                <input 
                    type="email" 
                    id="email" 
                    placeholder="tu@email.com" 
                    required
                >

                <div class="input-password-container">
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Contraseña" 
                        required
                    >
                    <button type="button" id="btnTogglePassword" class="toggle-eye" title="Mostrar contraseña">👁️</button>
                </div>
                
                <!-- Mensaje de error dinámico en rojo -->
                <span id="error-login" class="error-mensaje"></span>

                <a href="recover.html" class="link">¿Olvidaste tu contraseña?</a>

                <button type="submit" class="btn" id="btn-login" style="margin-top: 15px;">
                    Iniciar sesión
                </button>

            </form>

            <p class="texto-secundario">
                ¿No tienes cuenta?
                <a href="registro.html" class="link">Regístrate aquí</a>
            </p>

            <div class="enlace-invitado" style="margin-top: 15px; text-align: center;">
                <a href="index.html" style="color: #191970; text-decoration: none; font-size: 14px; font-weight: 600;">
                    Continuar como invitado (Ir a la tienda)
                </a>
            </div>

        </div>

        <script>
            // Toggle del ojito de la contraseña
            const btnTogglePassword = document.getElementById("btnTogglePassword");
            const inputPassword = document.getElementById("password");

            btnTogglePassword.addEventListener("click", () => {
                if (inputPassword.type === "password") {
                    inputPassword.type = "text";
                    btnTogglePassword.textContent = "🙈";
                } else {
                    inputPassword.type = "password";
                    btnTogglePassword.textContent = "👁️";
                }
            });

            // Gestión inteligente del formulario de login
            const formLogin = document.getElementById("form-login");
            const btnLogin = document.getElementById("btn-login");
            const errorSpan = document.getElementById("error-login");

            formLogin.addEventListener("submit", async (e) => {
                e.preventDefault(); // Evitamos que recargue la página automáticamente
                errorSpan.textContent = ""; // Limpiamos errores previos

                const email = document.getElementById("email").value.trim();
                const password = inputPassword.value.trim();

                // Activamos estado de carga (ventilador) solo al enviar realmente
                btnLogin.disabled = true;
                btnLogin.innerHTML = `<span class="cpu-fan-spinner"></span> Entrando...`;

                try {
                    const res = await fetch("http://localhost:3000/api/auth/login", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email, password })
                    });

                    const data = await res.json();

                    if (res.ok) {
                        // Éxito: Guardamos datos con la clave "user" que espera account.js
                        const usuarioData = data.usuario || data.user || data;
                        localStorage.setItem("user", JSON.stringify(usuarioData));
                        
                        window.location.href = "index.html";
                    } else {
                        // Error (correo no existe o contraseña mal): Mostramos en rojo abajo y restauramos botón
                        errorSpan.textContent = data.message || "Credenciales incorrectas.";
                        btnLogin.disabled = false;
                        btnLogin.innerHTML = "Iniciar sesión";
                    }
                } catch (error) {
                    console.error(error);
                    errorSpan.textContent = "Error de conexión con el servidor.";
                    btnLogin.disabled = false;
                    btnLogin.innerHTML = "Iniciar sesión";
                }
            });
        </script>

    </body>
</html>
