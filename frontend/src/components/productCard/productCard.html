<link rel="stylesheet" href="../../../estilos/responsive.css">

<div class="producto-card">

    <img class="producto-img" src="" alt="Producto">

    <h3 class="producto-nombre"></h3>
        <div class="producto-rating">
            ⭐ <span id="producto-rating">0.0</span> / 5
        </div>
    <p class="producto-precio"></p>


    <div class="botones-producto">
        <button class="btn-favorito ${esFavorito ? "activo" : ""}">
            <img src="/frontend/recursos/imagenes/corazon.png" alt="Favorito">
        </button>

        <button class="btn-comparar">
            <img src="/frontend/recursos/imagenes/comparar.png" alt="Comparar">
        </button>
    </div>
</div>
